# api.dianome.dev — manifests, telemetry ingest, aggregated stats.
# Chunks are NOT served here: they go R2 -> edge cache via cdn.dianome.dev (see docs/briefs/02-edge-brief.md).
name = "dianome-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
workers_dev = false

routes = [
  { pattern = "api.dianome.dev", custom_domain = true }
]

[observability]
enabled = true

[[r2_buckets]]
binding = "STORE"
bucket_name = "dianome"
# `wrangler dev` talks to the real bucket through the binding (no S3 keys); everything else stays local.
remote = true

[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "dianome_loads"

# Phase 5b: schema-3 session reports (mode, N, timings; never prompt content).
[[analytics_engine_datasets]]
binding = "SESSIONS"
dataset = "dianome_sessions"

# Split endpoints (GET /v1/split/servers, POST /v1/split/session[?model=], GET /v1/split/rates, GET /v1/split/plan[?model=]).
# SPLIT_SERVERS maps a model id to the server that runs it: 0.5B on Theo's Mac behind cloudflared at split.dianome.dev;
# 3B and 7B on the Phase 7 L4 pod at gpu.dianome.dev. The pod serves ONE model at a time (scripts/pod/serve.sh --model),
# so the A2 sequence is 7B -> swap -> 3B, and scripts/measure-remote.mjs checks that /plan reports the expected model
# before measuring. The first entry is the default model. The demo origin is the only one allowed to mint session
# tokens. Override locally in .dev.vars, e.g.
# SPLIT_SERVERS={"qwen2.5-0.5b-instruct":{"ws":"ws://127.0.0.1:8765","plan":"http://127.0.0.1:8765/plan"}}
# SPLIT_ALLOWED_ORIGINS=http://localhost:5177
[vars]
SPLIT_SERVERS = '{"qwen2.5-0.5b-instruct":{"ws":"wss://split.dianome.dev","plan":"https://split.dianome.dev/plan"},"qwen2.5-3b-instruct":{"ws":"wss://gpu.dianome.dev","plan":"https://gpu.dianome.dev/plan"},"qwen2.5-7b-instruct":{"ws":"wss://gpu.dianome.dev","plan":"https://gpu.dianome.dev/plan"}}'
SPLIT_ALLOWED_ORIGINS = "https://dianome-demo-split.pages.dev,https://dianome.dev"

[[kv_namespaces]]
binding = "STATS_CACHE"
id = "7c4f6c0ba5e44b0a82496b3639c90262"

# Secrets (wrangler secret put …; local values in .dev.vars, gitignored):
#   CF_ACCOUNT_ID      account that owns the dianome_loads dataset
#   CF_ANALYTICS_TOKEN API token with Account Analytics: Read (Analytics Engine SQL API)
#   SPLIT_SIGNING_KEY  HMAC key for split session tokens; the split server gets the same value in its env
# GIT_SHA is passed with --var by the dev/deploy scripts (see package.json).
