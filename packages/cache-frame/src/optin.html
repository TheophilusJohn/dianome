<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Dianome shared model cache</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px auto; max-width: 56ch; padding: 0 16px; line-height: 1.5; color: #222; }
  button { font: inherit; font-size: 16px; padding: 10px 18px; border-radius: 8px; border: 1px solid #8884; background: #1f6feb; color: #fff; cursor: pointer; }
  #status { margin-top: 12px; color: #555; }
</style>
</head>
<body>
<h1>Shared model cache</h1>
<p>Sites that use Dianome download AI model files to your browser; the shared cache keeps one copy on this device so a second site can reuse it instead of downloading it again. Nothing about you is stored, and you can remove the files at any time by clearing this site's data.</p>
<button id="enable" type="button">Enable shared model cache</button>
<p id="status"></p>
<script type="module">
  // Writes a 1 KB marker into the Cache API cache and a "visited" flag into localStorage, both top-level on this
  // origin. From inside a frame on another site, after a storage-access grant: marker visible → the Cache API is
  // unpartitioned (granted); only the flag visible → the Cache API stays partitioned (unsupported, no second visit);
  // neither → the visit has not happened yet. The top-level visit itself is what Chrome needs before granting.
  const MARKER = new URL("/frame/v1/marker", location.origin).href;
  const CACHE = "dianome-v1";
  const VISITED_KEY = "dianome:visited";            // localStorage flag, read by the frame after a grant
  const RETURN_PARAM = "dianome-visited";           // appended to the return URL so the SDK knows the visit happened
  const status = document.getElementById("status");
  const params = new URLSearchParams(location.search);
  const ret = (() => { try { const u = new URL(params.get("return") ?? ""); if (u.protocol !== "https:" && u.protocol !== "http:") return null; u.searchParams.set(RETURN_PARAM, "1"); return u.href; } catch { return null; } })();
  document.getElementById("enable").addEventListener("click", async () => {
    try {
      const cache = await caches.open(CACHE);
      await cache.put(MARKER, new Response(new Uint8Array(1024), { headers: { "Content-Type": "application/octet-stream", "Content-Length": "1024" } }));
      try { localStorage.setItem(VISITED_KEY, new Date().toISOString()); } catch {}
      status.textContent = ret ? "Enabled. Returning…" : "Enabled. You can close this page.";
      if (ret) location.href = ret;
    } catch (e) {
      status.textContent = `Could not enable: ${e && e.message ? e.message : String(e)}`;
    }
  });
  caches.open(CACHE).then((c) => c.match(MARKER)).then((m) => { if (m) status.textContent = "Already enabled on this device."; }).catch(() => {});
</script>
</body>
</html>
