[project]
name = "dianome-ingest"
version = "0.1.0"
description = "Phase 1 ingest: safetensors -> per-layer fp16/q8/q4 artifacts -> 8 MB content-addressed chunks -> manifest -> R2"
requires-python = ">=3.11"
dependencies = [
  "safetensors>=0.4",
  "numpy>=1.26",
  "huggingface_hub>=0.24",
  "boto3>=1.34",
  "jsonschema>=4.20",
  "click>=8.1",
  "ml_dtypes>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dianome-ingest = "dianome_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dianome_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
