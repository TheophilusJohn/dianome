<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dianome load times</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 72rem; line-height: 1.4; }
      table { border-collapse: collapse; margin: 0.5rem 0 1rem; }
      th, td { border: 1px solid #ccc; padding: 0.2rem 0.6rem; text-align: left; font-variant-numeric: tabular-nums; }
      td.num, th.num { text-align: right; }
      .bars div { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
      .bars span.label { width: 4rem; display: inline-block; }
      .bar { height: 0.8rem; background: #5470c6; display: inline-block; vertical-align: middle; }
      #note, #status { color: #666; }
      #banner { display: none; background: #fff3cd; border: 1px solid #e0c36a; padding: 0.5rem 0.8rem; margin: 0.5rem 0 1rem; }
      #banner.on { display: block; }
      .empty { color: #888; font-style: italic; }
      .err { color: #b00; }
    </style>
  </head>
  <body>
    <h1>Dianome load times</h1>
    <p id="status"></p>
    <div id="banner">Stats are <b>degraded</b>: the API could not reach the Analytics Engine SQL API, so every table below is empty.</div>
    <p id="note"></p>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
