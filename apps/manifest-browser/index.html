<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dianome manifest browser</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 72rem; line-height: 1.4; }
      table { border-collapse: collapse; margin: 0.5rem 0 1rem; }
      th, td { border: 1px solid #ccc; padding: 0.2rem 0.6rem; text-align: left; font-variant-numeric: tabular-nums; }
      td.num, th.num { text-align: right; }
      .bar { height: 0.8rem; background: #5470c6; display: inline-block; vertical-align: middle; }
      .bars div { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
      .bars span.label { width: 7rem; display: inline-block; }
      #status { color: #666; }
      code { font-size: 0.9em; }
      input { width: 34rem; max-width: 100%; }
    </style>
  </head>
  <body>
    <h1>Dianome manifest browser</h1>
    <form id="form">
      <label>Manifest URL <input id="url" type="text" /></label>
      <button type="submit">Load</button>
    </form>
    <p id="status"></p>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
